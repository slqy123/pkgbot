name: check

on:
  pull_request:
    paths:
      - 'packages/**'
      - 'pkgbot/**'
      - 'tests/**'
      - '.github/workflows/check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install git
        run: pacman -Sy --noconfirm --needed git
      - uses: actions/checkout@v4
      - name: Install tools
        run: pacman -Sy --noconfirm --needed python python-yaml python-tomli-w
      - name: Validate configuration
        run: python -m pkgbot check
      - name: Run tests
        run: python -m unittest discover -s tests
